spring.application.name=NexUs-Notify
spring.config.import=optional:file:.env.properties

server.port=${NOTIFY_PORT:8082}

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=${MONGO_DB}
spring.data.mongodb.auto-index-creation=true

notify.core.base-url=${CORE_BASE_URL:http://localhost:8080}
notify.core.token=${NOTIFY_CORE_TOKEN:}
notify.core.connect-timeout=${CORE_CONNECT_TIMEOUT:2s}
notify.core.read-timeout=${CORE_READ_TIMEOUT:5s}

notify.notification.product-days-before=3,1,0
notify.notification.event-days-before=7,3,1,0
notify.notification.page-size=100
notify.notification.zone-id=America/Sao_Paulo
