spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.properties
  application:
    name: NexUs-Notify
  mongodb:
    uri: ${MONGO_URI}
    database: ${MONGO_DB}
  data:
    mongodb:
      auto-index-creation: false

server:
  port: ${NOTIFY_PORT:8082}
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # O indicador padrao percorre TODOS os bancos (incluindo o "local") e o Atlas
  # bloqueia comandos no "local" mesmo para atlasAdmin. Desliga ele e usa o
  # AppMongoHealthIndicator, que consulta apenas o banco da aplicacao.
  health:
    mongodb:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 30s

app:
  admin:
    key: ${ADMIN_API_KEY:${TRACING_ACESS:}}
    metrics:
      step-ms: ${ADMIN_METRICS_STEP_MS:60000}
      retention-minutes: ${ADMIN_METRICS_RETENTION_MINUTES:720}
      counters: notify.push.deliveries,notify.notifications.created
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}

notify:
  nearby-stores:
    enabled: ${NOTIFY_NEARBY_STORES_ENABLED:true}
    radius-km: ${NOTIFY_NEARBY_STORES_RADIUS_KM:5}
    interval-days: ${NOTIFY_NEARBY_STORES_INTERVAL_DAYS:3}
  push:
    enabled: ${NOTIFY_PUSH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  core:
    base-url: ${CORE_BASE_URL:http://localhost:8080}
    token: ${NOTIFY_CORE_TOKEN:}
    connect-timeout: ${CORE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CORE_READ_TIMEOUT:5s}
  notification:
    product-days-before: [3, 1, 0]
    event-days-before: [7, 3, 1, 0]
    page-size: 100
    zone-id: America/Sao_Paulo
  scheduler:
    enabled: ${NOTIFY_SCHEDULER_ENABLED:true}
    cron: "${NOTIFY_SCHEDULER_CRON:0 0 11 * * *}"
